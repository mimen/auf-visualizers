<!doctype html><html><meta charset="utf-8"><title>AUF visualizer render</title>
<style>@font-face{font-family:Signate;src:url('../assets/SignateGrotesk-Black.ttf')}@font-face{font-family:Izoard;src:url('../assets/Izoard-Regular.otf')}
body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh}</style>
<canvas id="out"></canvas>
<script>
// Formats: youtube 16:9, story 9:16 with an empty band for the link sticker, reels 9:16 kept inside Instagram's
// safe zone (the caption and buttons cover roughly the bottom 420 px and the right 120 px).
const FORMAT = new URLSearchParams(location.search).get('format') || 'youtube';
self.VIZ_W = FORMAT === 'youtube' ? 1920 : 1080; self.VIZ_H = FORMAT === 'youtube' ? 1080 : 1920;
</script>
<script src="../lab/bg.js"></script>
<script src="liquid.js"></script>
<script type="module">
import { precompute } from '../lab/audio.js';
import { V2 } from '../lab/v2.js';
const q = new URLSearchParams(location.search), GUIDES = q.has('guides');
const LAYOUTS = {
  youtube: { art: [150, 238, 540], wave: { x: 800, y: 800, w: 980, h: 230 } },
  story: { art: [250, 480, 580], wave: { x: 96, y: 1280, w: 888, h: 150 } },
  reels: { art: [250, 440, 580], wave: { x: 96, y: 1230, w: 888, h: 150 } },
};
const L = LAYOUTS[FORMAT], ctx = document.getElementById('out').getContext('2d');
ctx.canvas.width = W; ctx.canvas.height = H;
const load = (s) => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => j(Error('Asset failed: ' + s)); i.src = s; });
const tint = (img) => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); return c; };
const text = (s, x, y, size, font = 'Izoard', color = '#fff', align = 'left') => { ctx.font = `${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y); };

// init(release) loads assets and analyses the whole track once; renderFrame(t) then draws track time t.
// Frames must be rendered in order at a fixed step, because the ridges keep history between frames.
window.init = async (rel) => {
  const [cover, illo, word, emblem] = await Promise.all([load(rel.cover), load(rel.illo), load('../assets/auf-records-s.png'), load('../assets/emblem-s.png'), document.fonts.load('40px Signate'), document.fonts.load('40px Izoard')]);
  const buf = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(await (await fetch('/audio')).arrayBuffer());
  const lookup = await precompute(buf, 0.01, rel.bpm), bg = liquid(illo), logo = tint(word), mark = tint(emblem);
  const ridges = V2.find((v) => v.id === 'ridges2'), st = ridges.init();
  const [ax, ay, as] = L.art, art = document.createElement('canvas'); art.width = W; art.height = H;
  { const x = art.getContext('2d'); x.shadowColor = '#0009'; x.shadowBlur = 70; x.shadowOffsetY = 28; x.drawImage(cover, ax, ay, as, as); }
  const LEAD = 0.03; // cancels the analysis window centre and envelope attack, as in the lab
  let prev = 0;
  window.renderFrame = (t, dt) => {
    const a = lookup(t + LEAD, prev + LEAD); prev = t;
    shineBackground(ctx, 0.9, 81, Math.sin(t * 0.1) * 180);
    ctx.save(); ctx.globalAlpha = 0.93; ctx.drawImage(bg(t, a.env[0] * 0.8, (a.env[4] + a.env[5]) / 2), 0, 0, W, H); ctx.restore();
    const shade = ctx.createRadialGradient(W * .5, H * .48, 50, W * .5, H * .48, W * .65); shade.addColorStop(0, '#211e3566'); shade.addColorStop(1, '#17142700'); ctx.fillStyle = shade; ctx.fillRect(0, 0, W, H);
    // Cover with its slow light sweep.
    ctx.drawImage(art, 0, 0); ctx.save(); ctx.beginPath(); ctx.rect(ax, ay, as, as); ctx.clip();
    const sw = ax - as + t % 18 / 18 * as * 3, g = ctx.createLinearGradient(sw, ay, sw + as * .5, ay + as * .15); g.addColorStop(0, '#ffffff00'); g.addColorStop(.5, '#ffffff20'); g.addColorStop(1, '#ffffff00');
    ctx.fillStyle = g; ctx.fillRect(ax, ay, as, as); ctx.restore(); ctx.strokeStyle = '#ffffff32'; ctx.lineWidth = 1; ctx.strokeRect(ax + .5, ay + .5, as - 1, as - 1);
    ctx.save(); ridges.draw(ctx, L.wave, a, st, t / buf.duration, dt); ctx.restore();
    const name = `${rel.title} (${rel.mix})`;
    if (FORMAT === 'youtube') {
      text(rel.artist, 800, 319, 48); text(rel.title, 790, 486, 182, 'Signate'); text(rel.mix, 806, 545, 31, 'Izoard', '#ddd8e7'); text(`${rel.release} / ${rel.catalog}`, 150, 866, 27, 'Izoard', '#ddd8e7');
      const lh = 76, lw = lh * logo.width / logo.height; ctx.drawImage(logo, 1780 - lw - lh - 30, 904, lw, lh); ctx.drawImage(mark, 1780 - lh, 904, lh, lh);
    } else if (FORMAT === 'story') {
      text(rel.artist, 540, 265, 40, 'Izoard', '#fff', 'center'); text(rel.release, 540, 370, 112, 'Signate', '#fff', 'center'); text(rel.catalog, 540, 412, 30, 'Izoard', '#ddd7e5', 'center');
      text(name, 540, 1380, 50, 'Izoard', '#fff', 'center'); text('OUT NOW', 540, 1438, 32, 'Izoard', '#e2dcea', 'center');
      // 1484..1684 stays empty for the link sticker; ?guides draws the slot.
      if (GUIDES) { ctx.save(); ctx.setLineDash([17, 14]); ctx.strokeStyle = '#ffffff77'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(150, 1484, 780, 200, 30); ctx.stroke(); ctx.restore(); }
      const lh = 92, lw = lh * logo.width / logo.height; ctx.drawImage(logo, 540 - lw - 20, 1718, lw, lh); ctx.drawImage(mark, 560, 1718, lh, lh);
    } else {
      text(rel.artist, 540, 235, 40, 'Izoard', '#fff', 'center'); text(rel.release, 540, 340, 112, 'Signate', '#fff', 'center'); text(rel.catalog, 540, 382, 30, 'Izoard', '#ddd7e5', 'center');
      text(name, 540, 1330, 50, 'Izoard', '#fff', 'center'); text('OUT NOW', 540, 1386, 32, 'Izoard', '#e2dcea', 'center');
      const lh = 80, lw = lh * logo.width / logo.height; ctx.drawImage(logo, 540 - lw - 18, 1418, lw, lh); ctx.drawImage(mark, 558, 1418, lh, lh);
      if (GUIDES) { ctx.fillStyle = '#ff000033'; ctx.fillRect(0, H - 420, W, 420); ctx.fillRect(W - 120, 0, 120, H); }
    }
  };
  return { duration: buf.duration };
};
</script></html>

const ghostCanvas=document.createElement('canvas');ghostCanvas.width=illo.width;ghostCanvas.height=illo.height;const ghostCtx=ghostCanvas.getContext('2d');ghostCtx.drawImage(illo,0,0);ghostCtx.globalCompositeOperation='destination-in';const ghostFade=ghostCtx.createLinearGradient(0,0,0,illo.height);ghostFade.addColorStop(0,'#fff');ghostFade.addColorStop(.6,'#fff');ghostFade.addColorStop(1,'#fff0');ghostCtx.fillStyle=ghostFade;ghostCtx.fillRect(0,0,illo.width,illo.height);const texture=new THREE.CanvasTexture(ghostCanvas);texture.colorSpace=THREE.SRGBColorSpace;const ghost=new THREE.Mesh(new THREE.PlaneGeometry(26,27),new THREE.MeshBasicMaterial({map:texture,transparent:true,opacity:.2,depthWrite:false}));ghost.position.set(STORY?0:7,8,-15);scene.add(ghost);

rayMaterial.uniforms.energy.value=.45+kick*.9;rayMaterial.uniforms.time.value=t;rays.forEach((ray,i)=>{ray.rotation.z=-.157+Math.sin(t*.045+i*.12)*.12;});orbs.forEach(({sprite,x,y,phase},i)=>{sprite.position.x=x+Math.sin(t*.065+phase)*.7;sprite.position.y=y+Math.sin(t*.1+phase)*.5;sprite.material.opacity=(i<12?.23:.3)+highs*(.15+.25*Math.sin(t+phase)**2);});
